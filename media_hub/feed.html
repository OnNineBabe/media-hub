<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素材投喂 · 智能识别</title>
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5eaf1;
  --blue:#2563eb; --blue-deep:#1e40af; --grad:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#3b82f6);
  --ok:#0e7a5f; --ok-bg:#e6f5ef; --warn:#b45309; --warn-bg:#fdf3e3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.6;
  padding:0 0 60px}
.top{background:var(--grad);color:#fff;padding:26px 0 30px;}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
.top .row{display:flex;align-items:center;gap:12px}
.top .ico{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.top h1{font-size:20px;letter-spacing:.5px}
.top .sub{font-size:12.5px;opacity:.88;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px;
  box-shadow:0 4px 16px rgba(30,64,175,.05)}
.card h2{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h2 .no{display:inline-flex;width:22px;height:22px;border-radius:6px;background:#eef4ff;color:var(--blue);
  align-items:center;justify-content:center;font-size:12px;font-weight:700}
.hint{color:var(--sub);font-size:12.5px;margin:0 0 15px}
/* 投喂区 */
.drop{border:2px dashed #cbd7e8;border-radius:12px;padding:30px 20px;text-align:center;background:#fafcff;transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f0f6ff}
.drop .big{font-size:15px;font-weight:600;margin-bottom:5px}
.drop .sm{font-size:12px;color:var(--sub)}
.ta{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;
  font-family:inherit;margin-top:14px;resize:vertical;outline:none;color:var(--ink)}
.ta:focus{border-color:#93b8f0;box-shadow:0 0 0 3px rgba(147,184,240,.2)}
.ta::placeholder{color:#9aa3af}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchip{background:#eef4ff;color:var(--blue-deep);border:1px solid #cfe0fb;border-radius:7px;padding:5px 11px;font-size:12px;
  display:inline-flex;align-items:center;gap:7px}
.fchip .x{cursor:pointer;color:#93a3b8;font-weight:700}
.bar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:10px 20px;font-size:13.5px;transition:.15s}
.btn:hover{background:#f5f7fa}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue-deep)}
.btn.pri:disabled{opacity:.5;cursor:not-allowed}
.mini{font-size:12px;color:var(--sub)}
/* 结果区 */
.res-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:12px;background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:4px 12px;font-weight:600}
.cand{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;background:#fbfcfe;display:flex;gap:12px;align-items:flex-start}
.cand:last-child{margin-bottom:0}
.cand.hi{border-left:3px solid var(--blue)}
.cand input[type=checkbox]{width:17px;height:17px;margin-top:3px;flex-shrink:0;accent-color:var(--blue);cursor:pointer}
.cand .body{flex:1;min-width:0}
.cand .meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.cand .nm{font-weight:700;font-size:14px}
.cand .lv{font-size:10px;border-radius:4px;padding:1.5px 7px;font-weight:600}
.lv.high{background:#eef4ff;color:var(--blue)} .lv.medium{background:var(--warn-bg);color:var(--warn)}
.cand select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#fff;color:var(--ink);cursor:pointer}
.cand .txt{font-size:12.7px;color:#374151;line-height:1.7}
.cand .src{font-size:11px;color:var(--sub);margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:26px 0;font-size:13px}
.hidden{display:none}
/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;
  padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="row"><div class="ico">✨</div><div>
    <h1>素材投喂 · 智能识别</h1>
    <div class="sub">把素材丢进来，自动识别「谁 + 哪个字段 + 什么内容」，勾选确认即可入库</div>
  </div></div>
</div></div>

<div class="wrap">
  <!-- 投喂 -->
  <div class="card">
    <h2><span class="no">1</span>投喂素材</h2>
    <p class="hint">支持拖拽文件（PPT / Word / PDF / 图片 / 录音 / txt）或直接粘贴文字，可同时使用。</p>
    <div class="drop" id="drop">
      <div class="big">📥 把文件拖到这里，或点击选择</div>
      <div class="sm">图片自动 OCR · 录音自动转写 · 文档自动解析</div>
    </div>
    <input type="file" id="picker" multiple hidden>
    <div class="files" id="files"></div>
    <textarea class="ta" id="text" placeholder="或直接粘贴一段内容，例如：&#10;经济观察报社长刘坚，2026年11月新增兼任中国传媒大学新闻学院客座教授……"></textarea>
    <div class="bar">
      <button class="btn pri" id="btnRec">✨ 开始识别</button>
      <span class="mini" id="recInfo"></span>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card hidden" id="resultCard">
    <div class="res-hd">
      <h2><span class="no">2</span>识别结果 · 勾选要入库的</h2>
      <span class="badge" id="resBadge">识别到 0 条</span>
    </div>
    <p class="hint">默认勾选高价值项；字段选错了可直接改。只有勾选的才会写入。</p>
    <div id="cands"></div>
    <div class="bar">
      <button class="btn pri" id="btnCommit">✓ 确认入库</button>
      <button class="btn" id="btnAll">全选</button>
      <button class="btn" id="btnNone">全不选</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let pending = [];      // 待上传文件 {name,data}
let candidates = [];   // 识别结果
let batch = '';
const API = '';  // 同源，本地服务

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- 文件选择 ---- */
function addFiles(list){
  for(const f of list){
    const r = new FileReader();
    r.onload = e => {
      pending.push({name:f.name, data:e.target.result});
      renderFiles();
    };
    r.readAsDataURL(f);
  }
}
function renderFiles(){
  $('files').innerHTML = pending.map((f,i)=>
    `<span class="fchip">📄 ${esc(f.name)} <span class="x" onclick="rmFile(${i})">✕</span></span>`).join('');
}
window.rmFile = i => { pending.splice(i,1); renderFiles(); };
$('drop').onclick = ()=> $('picker').click();
$('picker').onchange = e => { addFiles(e.target.files); $('picker').value=''; };
['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{
  e.preventDefault(); if(ev==='dragleave') return;
  $('drop').classList.remove('over');
  if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
}));

/* ---- 识别 ---- */
$('btnRec').onclick = async ()=>{
  const text = $('text').value.trim();
  if(!text && !pending.length){ toast('先投喂点内容：粘贴文字或拖入文件'); return; }
  const btn = $('btnRec');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>识别中…';
  $('recInfo').textContent = '正在解析素材并识别字段，请稍候…';
  try{
    const r = await fetch(API+'/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, files:pending})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '识别失败');
    candidates = d.candidates || []; batch = d.batch || '';
    renderCands();
    $('resultCard').classList.remove('hidden');
    $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
    $('recInfo').textContent = d.msg || ('识别完成 · '+candidates.length+' 条');
    if(!candidates.length) toast(d.msg || '未识别到新要点');
  }catch(e){
    toast('识别失败：'+e.message);
    $('recInfo').textContent = '';
  }finally{
    btn.disabled=false; btn.textContent='✨ 开始识别';
  }
};

const FIELDS = [['career','工作履历'],['identity','社会身份'],['works','著作'],
  ['hobbies','爱好与社会关系'],['brief','简介'],['t','职务'],['edu','教育'],
  ['award','奖惩'],['birth','出生'],['origin','籍贯'],['party','党派'],['gender','性别']];
function renderCands(){
  $('resBadge').textContent = '识别到 '+candidates.length+' 条';
  if(!candidates.length){
    $('cands').innerHTML = '<div class="empty">没有识别到新的要点（可能都是档案里已有的信息）</div>';
    return;
  }
  $('cands').innerHTML = candidates.map((c,i)=>{
    const checked = c.level==='high' ? 'checked' : '';
    const opts = FIELDS.map(([v,l])=>`<option value="${v}"${v===c.field?' selected':''}>${l}</option>`).join('');
    return `<div class="cand ${c.level==='high'?'hi':''}">
      <input type="checkbox" data-i="${i}" class="ck" ${checked}>
      <div class="body">
        <div class="meta">
          <span class="nm">${esc(c.person)}</span>
          <span class="lv ${esc(c.level)}">${c.level==='high'?'高价值':'中价值'}</span>
          <select data-i="${i}" class="fld">${opts}</select>
        </div>
        <div class="txt">${esc(c.text)}</div>
        ${c.src_file?`<div class="src">来源：${esc(c.src_file)}${c.src_loc?' · '+esc(c.src_loc):''}</div>`:''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.ck').forEach(el=>el.onchange=e=>{
    candidates[+e.target.dataset.i].checked = e.target.checked;
  });
  document.querySelectorAll('.fld').forEach(el=>el.onchange=e=>{
    candidates[+e.target.dataset.i].field = e.target.value;
  });
  // 初始化 checked 状态
  candidates.forEach(c=>{ c.checked = c.level==='high'; });
}
$('btnAll').onclick = ()=>{ document.querySelectorAll('.ck').forEach(x=>x.checked=true); candidates.forEach(c=>c.checked=true); };
$('btnNone').onclick = ()=>{ document.querySelectorAll('.ck').forEach(x=>x.checked=false); candidates.forEach(c=>c.checked=false); };

/* ---- 确认入库 ---- */
$('btnCommit').onclick = async ()=>{
  const chosen = candidates.filter(c=>c.checked);
  if(!chosen.length){ toast('请至少勾选一条'); return; }
  const btn=$('btnCommit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>入库中…';
  try{
    const r = await fetch(API+'/api/commit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({batch, items:chosen})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '入库失败');
    toast(`✓ 已入库 ${d.written} 条，网页已同步`);
    // 清空本次
    candidates=[]; pending=[]; $('text').value=''; renderFiles();
    $('resultCard').classList.add('hidden'); $('recInfo').textContent='';
  }catch(e){ toast('入库失败：'+e.message); }
  finally{ btn.disabled=false; btn.textContent='✓ 确认入库'; }
};
</script>
</body>
</html>
